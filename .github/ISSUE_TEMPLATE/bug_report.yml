name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Fedora 42...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AstroPostMaster version
      description: Shown in Settings ▸ About.
